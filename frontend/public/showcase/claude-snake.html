<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>霓虹贪吃蛇</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:radial-gradient(circle at 50% 25%,#1a0838 0%,#07030f 70%);
  color:#bffcff;font-family:"Segoe UI",system-ui,sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:none;overflow:hidden;
}
h1{
  font-size:28px;letter-spacing:6px;color:#fff;
  text-shadow:0 0 6px #0ff,0 0 16px #0ff,0 0 32px #08f;
}
.board{display:flex;gap:28px;font-size:15px;letter-spacing:2px}
.board div{
  padding:6px 16px;border:1px solid #0ff6;border-radius:8px;
  background:#0ff1;box-shadow:0 0 12px #0ff3 inset;
}
.board b{color:#ff4fd8;text-shadow:0 0 8px #f0c;font-size:18px;margin-left:6px}
canvas{
  width:min(92vw,62vh,480px);aspect-ratio:1;
  border:2px solid #0ff;border-radius:10px;background:#070312;
  box-shadow:0 0 14px #0ff,0 0 40px #0ff5,inset 0 0 30px #0ff3;
}
p{font-size:13px;color:#7aa;letter-spacing:1px}
</style>
</head>
<body>
<h1>NEON SNAKE</h1>
<div class="board">
  <div>分数<b id="score">0</b></div>
  <div>最高分<b id="best">0</b></div>
</div>
<canvas id="c" width="480" height="480"></canvas>
<p>方向键 / WASD 或触屏滑动控制</p>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const N = 20, S = cv.width / N;
const scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
let snake, dir, queue, food, score, speed, state, last = 0;
let best = 0;
try { best = +localStorage.getItem('neonSnakeBest') || 0; } catch (e) {}
bestEl.textContent = best;

function reset() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0}; queue = []; score = 0; speed = 130; state = 'ready';
  scoreEl.textContent = 0;
  placeFood();
}
function restart() { reset(); state = 'play'; last = performance.now(); }
function placeFood() {
  do { food = {x:Math.random()*N|0, y:Math.random()*N|0}; }
  while (snake.some(s => s.x === food.x && s.y === food.y));
}
function turn(dx, dy) {
  if (state === 'over') return;
  const ref = queue.length ? queue[queue.length - 1] : dir;
  if ((dx === -ref.x && dy === -ref.y) || (dx === ref.x && dy === ref.y)) return;
  if (queue.length < 3) queue.push({x:dx, y:dy});
  if (state === 'ready') { state = 'play'; last = performance.now(); }
}
function gameOver() {
  state = 'over';
  if (score > best) {
    best = score; bestEl.textContent = best;
    try { localStorage.setItem('neonSnakeBest', best); } catch (e) {}
  }
}
function step() {
  if (queue.length) dir = queue.shift();
  const h = {x:snake[0].x + dir.x, y:snake[0].y + dir.y};
  const eat = h.x === food.x && h.y === food.y;
  const body = eat ? snake : snake.slice(0, -1);
  if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || body.some(s => s.x === h.x && s.y === h.y)) return gameOver();
  snake.unshift(h);
  if (eat) {
    score += 10; scoreEl.textContent = score;
    speed = Math.max(60, speed - 2);
    placeFood();
  } else snake.pop();
}

function glowRect(x, y, color, blur, inset) {
  ctx.shadowColor = color; ctx.shadowBlur = blur; ctx.fillStyle = color;
  ctx.fillRect(x * S + inset, y * S + inset, S - inset * 2, S - inset * 2);
}
function overlay(title, sub) {
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(5,2,12,.72)'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.textAlign = 'center';
  ctx.shadowColor = '#f0c'; ctx.shadowBlur = 20; ctx.fillStyle = '#fff';
  ctx.font = 'bold 44px "Segoe UI",sans-serif';
  ctx.fillText(title, cv.width / 2, cv.height / 2 - 6);
  ctx.shadowColor = '#0ff'; ctx.shadowBlur = 10; ctx.fillStyle = '#bffcff';
  ctx.font = '18px "Segoe UI",sans-serif';
  ctx.fillText(sub, cv.width / 2, cv.height / 2 + 32);
}
function draw(t) {
  ctx.shadowBlur = 0; ctx.fillStyle = '#070312'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.strokeStyle = 'rgba(0,255,255,.06)'; ctx.lineWidth = 1;
  for (let i = 1; i < N; i++) {
    ctx.beginPath(); ctx.moveTo(i * S, 0); ctx.lineTo(i * S, cv.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * S); ctx.lineTo(cv.width, i * S); ctx.stroke();
  }
  glowRect(food.x, food.y, '#ff2fd0', 14 + 8 * Math.sin(t / 160), 4 + Math.sin(t / 160));
  for (let i = snake.length - 1; i >= 0; i--) {
    const s = snake[i];
    glowRect(s.x, s.y, i === 0 ? '#eaffff' : `hsl(${185 + i * 4},100%,${60 - Math.min(i, 20)}%)`, i === 0 ? 20 : 12, 2);
  }
  ctx.shadowBlur = 0;
  if (state === 'ready') overlay('准备开始', '按方向键或滑动屏幕');
  else if (state === 'over') overlay('GAME OVER', `得分 ${score} · 点击重新开始`);
}
function loop(t) {
  if (state === 'play' && t - last >= speed) { last = t; step(); }
  draw(t);
  requestAnimationFrame(loop);
}

const keys = {ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
addEventListener('keydown', e => {
  const k = keys[e.key] || keys[e.key.toLowerCase()];
  if (!k) return;
  e.preventDefault(); turn(k[0], k[1]);
});

let tx = 0, ty = 0, moved = false;
cv.addEventListener('touchstart', e => {
  e.preventDefault(); tx = e.touches[0].clientX; ty = e.touches[0].clientY; moved = false;
}, {passive:false});
cv.addEventListener('touchmove', e => {
  e.preventDefault();
  const dx = e.touches[0].clientX - tx, dy = e.touches[0].clientY - ty;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  Math.abs(dx) > Math.abs(dy) ? turn(dx > 0 ? 1 : -1, 0) : turn(0, dy > 0 ? 1 : -1);
  tx = e.touches[0].clientX; ty = e.touches[0].clientY; moved = true;
}, {passive:false});
cv.addEventListener('touchend', e => {
  e.preventDefault();
  if (!moved && state === 'over') restart();
}, {passive:false});
cv.addEventListener('click', () => { if (state === 'over') restart(); });

reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
